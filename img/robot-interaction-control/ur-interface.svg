<svg xmlns="http://www.w3.org/2000/svg" width="700" height="795" viewBox="0 0 700 795" role="img"><title>UR：指定力轴与机器人施加的力</title><desc>同一压表面任务的用户命令、机器人内部接口与力方向示意。机械臂轮廓为功能示意。</desc><defs><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#087f8c"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#b45038"/></marker></defs><rect width="700" height="795" rx="14" fill="#f6f9fc"/><g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif"><text x="25" y="40" font-size="28" fill="#203b50" font-weight="600">UR：指定力轴与机器人施加的力</text><rect x="30" y="78" width="640" height="145" rx="12" fill="#fff" stroke="#087f8c" stroke-width="2"/><text x="48" y="113" font-size="25" fill="#087f8c" font-weight="600">用户侧：本例交给机器人的命令</text><text x="48" y="148" font-size="22" fill="#586f7e" >force_mode：任务坐标＋选择轴＋wrench</text><text x="48" y="179" font-size="22" fill="#586f7e" >世界 +Z 向上，机器人向下压 5 N：</text><text x="48" y="210" font-size="22" fill="#586f7e" >wrench 的 F_z = −5 N</text><path d="M340 227 L340 273" stroke="#087f8c" stroke-width="3" fill="none" marker-end="url(#teal)"/><rect x="30" y="280" width="640" height="115" rx="12" fill="#fff" stroke="#087f8c" stroke-width="2"/><text x="48" y="315" font-size="25" fill="#087f8c" font-weight="600">机器人控制器与接口边界</text><text x="48" y="350" font-size="22" fill="#586f7e" >内置力模式调节选中的法向轴。</text><text x="48" y="381" font-size="22" fill="#586f7e" >配套运动程序规定切向轨迹。</text><path d="M340 399 L340 443" stroke="#087f8c" stroke-width="3" fill="none" marker-end="url(#teal)"/><g transform="translate(65 425) scale(0.85)"><path d="M0 150 V105 L70 30 L150 75 L200 150" fill="none" stroke="#7b91a3" stroke-width="25" stroke-linejoin="round"/><circle cx="70" cy="30" r="14" fill="#fff" stroke="#7b91a3" stroke-width="5"/><circle cx="150" cy="75" r="14" fill="#fff" stroke="#7b91a3" stroke-width="5"/><rect x="176" y="152" width="48" height="25" rx="4" fill="#087f8c"/></g><rect x="185" y="577" width="440" height="50" fill="#dcebed"/><path d="M185 577 L625 577" stroke="#203b50" stroke-width="3" fill="none" /><path d="M235 545 L235 590" stroke="#b45038" stroke-width="3" fill="none" marker-end="url(#red)"/><text x="267" y="550" font-size="22" fill="#b45038" >机器人向下压表面</text><path d="M570 565 L570 475" stroke="#087f8c" stroke-width="3" fill="none" marker-end="url(#teal)"/><text x="585" y="502" font-size="22" fill="#203b50" >+Z</text><text x="350" y="638" font-size="22" fill="#087f8c" text-anchor="middle">环境向上反推，F_ext,z = +5 N</text><rect x="30" y="661" width="640" height="110" rx="12" fill="#fff" stroke="#087f8c" stroke-width="2"/><text x="48" y="696" font-size="25" fill="#087f8c" font-weight="600">读图时追踪这个区别</text><text x="48" y="731" font-size="22" fill="#586f7e" >顺应轴 limits 是速度；其他轴是偏差上限。</text></g></svg>
