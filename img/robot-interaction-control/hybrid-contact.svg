<svg xmlns="http://www.w3.org/2000/svg" width="920" height="460" viewBox="0 0 920 460" role="img"><title>混合力位控制：先把任务方向分清</title><desc>末端沿表面切向跟踪运动，并在法向建立目标接触力。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#087f8c"/></marker></defs><rect width="920" height="460" rx="16" fill="#f7fafc"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="28" y="37" font-size="23" fill="#17324d" font-weight="600">混合力位控制：先把任务方向分清</text><rect x="65" y="275" width="510" height="70" fill="#dfe9ee"/><line x1="65" y1="275" x2="575" y2="275" stroke="#17324d" stroke-width="3" /><path d="M165 95 L245 155 L315 138 L365 225" fill="none" stroke="#52738d" stroke-width="24" stroke-linejoin="round"/><circle cx="245" cy="155" r="15" fill="#fff" stroke="#52738d" stroke-width="5"/><circle cx="315" cy="138" r="15" fill="#fff" stroke="#52738d" stroke-width="5"/><rect x="340" y="230" width="55" height="45" rx="6" fill="#087f8c"/><line x1="390" y1="244" x2="550" y2="244" stroke="#087f8c" stroke-width="2.4" marker-end="url(#arrow)"/><text x="422" y="220" font-size="18" fill="#087f8c" >切向运动 +t</text><line x1="367" y1="225" x2="367" y2="160" stroke="#087f8c" stroke-width="2.4" marker-end="url(#arrow)"/><text x="382" y="167" font-size="18" fill="#087f8c" >法向 +n</text><line x1="310" y1="200" x2="310" y2="260" stroke="#cb5b5b" stroke-width="3" /><path d="M304 251 L310 264 L316 251z" fill="#cb5b5b"/><text x="90" y="224" font-size="17" fill="#cb5b5b" >机器人压向表面</text><text x="85" y="325" font-size="18" fill="#617487" >接触面</text><rect x="610" y="100" width="275" height="88" rx="12" fill="#ffffff" stroke="#087f8c" stroke-width="2"/><text x="747.5" y="132" font-size="19" fill="#087f8c" text-anchor="middle" font-weight="600">切向：运动目标</text><text x="747.5" y="160" font-size="15" fill="#617487" text-anchor="middle">沿表面移动、跟踪轨迹</text><rect x="610" y="215" width="275" height="88" rx="12" fill="#ffffff" stroke="#087f8c" stroke-width="2"/><text x="747.5" y="247" font-size="19" fill="#087f8c" text-anchor="middle" font-weight="600">法向：力目标</text><text x="747.5" y="275" font-size="15" fill="#617487" text-anchor="middle">维持接触、调节法向力</text><text x="28" y="396" font-size="18" fill="#17324d" >选择矩阵必须在同一接触坐标系下使用；法向位置由接触与力调节共同决定。</text><text x="28" y="429" font-size="17" fill="#617487" >经典混合控制按方向分配目标：不会在同一受约束方向任意指定位置和接触力。</text></g></svg>