<svg xmlns="http://www.w3.org/2000/svg" width="700" height="555" viewBox="0 0 700 555" role="img"><title>点力怎样变成关节力矩？</title><desc>示意机械臂末端点力通过各关节力臂产生力矩，功率一致性给出雅可比转置映射。图形只表示两个可见关节。</desc><defs><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#087f8c"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#b45038"/></marker></defs><rect width="700" height="555" rx="14" fill="#f6f9fc"/><g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif"><text x="25" y="40" font-size="28" fill="#203b50" font-weight="600">点力怎样变成关节力矩？</text><g transform="translate(55 90) scale(1.3)"><path d="M0 150 V105 L70 30 L150 75 L200 150" fill="none" stroke="#7b91a3" stroke-width="25" stroke-linejoin="round"/><circle cx="70" cy="30" r="14" fill="#fff" stroke="#7b91a3" stroke-width="5"/><circle cx="150" cy="75" r="14" fill="#fff" stroke="#7b91a3" stroke-width="5"/><rect x="176" y="152" width="48" height="25" rx="4" fill="#087f8c"/></g><path d="M315 315 L440 315" stroke="#b45038" stroke-width="3" fill="none" marker-end="url(#red)"/><text x="340" y="291" font-size="24" fill="#b45038" >点力 f</text><text x="35" y="365" font-size="23" fill="#203b50" >同一处受力，同时影响多个关节</text><rect x="25" y="405" width="650" height="130" rx="12" fill="#fff" stroke="#087f8c" stroke-width="2"/><text x="43" y="440" font-size="25" fill="#087f8c" font-weight="600">从末端到关节：功率是同一个量</text><text x="43" y="475" font-size="22" fill="#586f7e" >末端速度 v = J q̇；外力矩 τ_ext = Jᵀ f。</text><text x="43" y="506" font-size="22" fill="#586f7e" >选哪个接触点，就用哪个点的 J。</text><text x="70" y="128" font-size="22" fill="#203b50" >关节 1</text><text x="236" y="171" font-size="22" fill="#203b50" >关节 2</text><path d="M125 185 A40 40 0 0 1 178 210" stroke="#087f8c" stroke-width="3" fill="none" marker-end="url(#teal)"/><path d="M250 220 A36 36 0 0 1 291 248" stroke="#087f8c" stroke-width="3" fill="none" marker-end="url(#teal)"/></g></svg>
