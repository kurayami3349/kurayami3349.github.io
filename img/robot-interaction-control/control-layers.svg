<svg xmlns="http://www.w3.org/2000/svg" width="920" height="440" viewBox="0 0 920 440" role="img"><title>从任务目标到电机：控制链路的不同层次</title><desc>任务目标、控制器、命令接口、执行内环、物理对象及测量反馈。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#087f8c"/></marker></defs><rect width="920" height="440" rx="16" fill="#f7fafc"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="28" y="37" font-size="23" fill="#17324d" font-weight="600">从任务目标到电机：控制链路的不同层次</text><rect x="35" y="90" width="240" height="85" rx="12" fill="#ffffff" stroke="#087f8c" stroke-width="2"/><text x="155" y="122" font-size="19" fill="#087f8c" text-anchor="middle" font-weight="600">任务目标</text><text x="155" y="150" font-size="15" fill="#617487" text-anchor="middle">轨迹、接触力、柔顺行为</text><rect x="340" y="90" width="240" height="85" rx="12" fill="#ffffff" stroke="#087f8c" stroke-width="2"/><text x="460" y="122" font-size="19" fill="#087f8c" text-anchor="middle" font-weight="600">控制器与参考生成</text><text x="460" y="150" font-size="15" fill="#617487" text-anchor="middle">PID、阻抗、导纳、混合</text><rect x="645" y="90" width="240" height="85" rx="12" fill="#ffffff" stroke="#087f8c" stroke-width="2"/><text x="765" y="122" font-size="19" fill="#087f8c" text-anchor="middle" font-weight="600">命令接口</text><text x="765" y="150" font-size="15" fill="#617487" text-anchor="middle">位置 / 速度 / 力矩</text><line x1="277" y1="132" x2="335" y2="132" stroke="#087f8c" stroke-width="2.4" marker-end="url(#arrow)"/><line x1="582" y1="132" x2="640" y2="132" stroke="#087f8c" stroke-width="2.4" marker-end="url(#arrow)"/><line x1="765" y1="180" x2="765" y2="240" stroke="#087f8c" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="645" y="247" width="240" height="85" rx="12" fill="#ffffff" stroke="#087f8c" stroke-width="2"/><text x="765" y="279" font-size="19" fill="#087f8c" text-anchor="middle" font-weight="600">驱动与执行内环</text><text x="765" y="307" font-size="15" fill="#617487" text-anchor="middle">电流 → 电机 → 关节</text><line x1="640" y1="290" x2="585" y2="290" stroke="#087f8c" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="340" y="247" width="240" height="85" rx="12" fill="#ffffff" stroke="#087f8c" stroke-width="2"/><text x="460" y="279" font-size="19" fill="#087f8c" text-anchor="middle" font-weight="600">机器人与接触环境</text><text x="460" y="307" font-size="15" fill="#617487" text-anchor="middle">运动与力由物理共同决定</text><line x1="335" y1="290" x2="280" y2="290" stroke="#087f8c" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="35" y="247" width="240" height="85" rx="12" fill="#ffffff" stroke="#087f8c" stroke-width="2"/><text x="155" y="279" font-size="19" fill="#087f8c" text-anchor="middle" font-weight="600">测量与估计</text><text x="155" y="307" font-size="15" fill="#617487" text-anchor="middle">编码器、力传感器、观测器</text><path d="M155 247 V208 H460 V180" fill="none" stroke="#087f8c" stroke-width="2.4" marker-end="url(#arrow)"/><text x="28" y="380" font-size="20" fill="#17324d" font-weight="600">发送什么指令，与实现什么控制目标，是两个问题。</text><text x="28" y="411" font-size="18" fill="#617487" >例如：导纳可以发送位置；接收位置的内环也可能是阻抗或逆动力学控制。</text></g></svg>