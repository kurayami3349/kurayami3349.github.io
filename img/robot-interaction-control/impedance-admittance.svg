<svg xmlns="http://www.w3.org/2000/svg" width="920" height="590" viewBox="0 0 920 590" role="img"><title>阻抗与导纳：力—运动关系相似，实现链路不同</title><desc>对比实际运动反馈生成力矩的阻抗，以及力输入生成虚拟参考再由运动内环追踪的导纳。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#087f8c"/></marker></defs><rect width="920" height="590" rx="16" fill="#f7fafc"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="28" y="37" font-size="23" fill="#17324d" font-weight="600">阻抗与导纳：力—运动关系相似，实现链路不同</text><text x="30" y="83" font-size="21" fill="#087f8c" font-weight="600">A · 基础阻抗：实际偏差 → 控制力 → 实际运动</text><rect x="30" y="115" width="190" height="82" rx="12" fill="#ffffff" stroke="#087f8c" stroke-width="2"/><text x="125" y="147" font-size="19" fill="#087f8c" text-anchor="middle" font-weight="600">平衡点 / 轨迹</text><text x="125" y="175" font-size="15" fill="#617487" text-anchor="middle">x₀ 或 x_d</text><rect x="282" y="115" width="250" height="82" rx="12" fill="#ffffff" stroke="#087f8c" stroke-width="2"/><text x="407" y="147" font-size="19" fill="#087f8c" text-anchor="middle" font-weight="600">阻抗控制律</text><text x="407" y="175" font-size="15" fill="#617487" text-anchor="middle">实际位置、速度误差</text><rect x="595" y="115" width="295" height="82" rx="12" fill="#ffffff" stroke="#087f8c" stroke-width="2"/><text x="742.5" y="147" font-size="19" fill="#087f8c" text-anchor="middle" font-weight="600">力矩接口 → 机器人</text><text x="742.5" y="175" font-size="15" fill="#617487" text-anchor="middle">产生实际状态 x、v</text><line x1="223" y1="156" x2="276" y2="156" stroke="#087f8c" stroke-width="2.4" marker-end="url(#arrow)"/><line x1="535" y1="156" x2="589" y2="156" stroke="#087f8c" stroke-width="2.4" marker-end="url(#arrow)"/><text x="549" y="141" font-size="15" fill="#617487" >力</text><path d="M744 200 V240 H408 V201" fill="none" stroke="#087f8c" stroke-width="2.4" marker-end="url(#arrow)"/><text x="470" y="231" font-size="17" fill="#617487" >实际运动反馈</text><line x1="744" y1="65" x2="744" y2="109" stroke="#087f8c" stroke-width="2.4" marker-end="url(#arrow)"/><text x="774" y="84" font-size="16" fill="#617487" >外力作用</text><line x1="30" y1="275" x2="890" y2="275" stroke="#d8e3ea" stroke-width="2" /><text x="30" y="316" font-size="21" fill="#087f8c" font-weight="600">B · 基础导纳：测量外力 → 虚拟运动 → 内环追踪</text><rect x="30" y="350" width="190" height="82" rx="12" fill="#ffffff" stroke="#087f8c" stroke-width="2"/><text x="125" y="382" font-size="19" fill="#087f8c" text-anchor="middle" font-weight="600">外力测量 / 估计</text><text x="125" y="410" font-size="15" fill="#617487" text-anchor="middle">f_ext 或力误差</text><rect x="282" y="350" width="250" height="82" rx="12" fill="#ffffff" stroke="#087f8c" stroke-width="2"/><text x="407" y="382" font-size="19" fill="#087f8c" text-anchor="middle" font-weight="600">导纳虚拟模型</text><text x="407" y="410" font-size="15" fill="#617487" text-anchor="middle">积分得到 x_v、v_v</text><rect x="595" y="350" width="295" height="82" rx="12" fill="#ffffff" stroke="#087f8c" stroke-width="2"/><text x="742.5" y="382" font-size="19" fill="#087f8c" text-anchor="middle" font-weight="600">运动内环 → 机器人</text><text x="742.5" y="410" font-size="15" fill="#617487" text-anchor="middle">实际状态 x、v</text><line x1="223" y1="391" x2="276" y2="391" stroke="#087f8c" stroke-width="2.4" marker-end="url(#arrow)"/><line x1="535" y1="391" x2="589" y2="391" stroke="#087f8c" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M744 435 V475 H620 V435" fill="none" stroke="#087f8c" stroke-width="2.4" marker-end="url(#arrow)"/><text x="400" y="481" font-size="17" fill="#617487" >内环使用实际运动反馈</text><line x1="815" y1="310" x2="815" y2="344" stroke="#087f8c" stroke-width="2.4" marker-end="url(#arrow)"/><text x="833" y="330" font-size="15" fill="#617487" >外力</text><path d="M860 435 V504 H125 V437" fill="none" stroke="#087f8c" stroke-width="2.2" marker-end="url(#arrow)"/><text x="180" y="486" font-size="16" fill="#617487" >接触力反馈</text><text x="30" y="527" font-size="18" fill="#17324d" >导纳的虚拟位置与实际位置需要分别记录；它们只在内环足够理想时近似相同。</text><text x="30" y="561" font-size="17" fill="#617487" >图示是基础架构。一般阻抗也可使用力反馈，导纳实现也可能混合实际状态反馈。</text></g></svg>