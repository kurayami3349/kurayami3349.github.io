<svg xmlns="http://www.w3.org/2000/svg" width="920" height="440" viewBox="0 0 920 440" role="img"><title>质量—弹簧—阻尼：一套力平衡模型</title><desc>并联的弹簧和阻尼器连接质量块，向右的外力作用于质量块。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#087f8c"/></marker></defs><rect width="920" height="440" rx="16" fill="#f7fafc"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="28" y="37" font-size="23" fill="#17324d" font-weight="600">质量—弹簧—阻尼：一套力平衡模型</text><line x1="100" y1="90" x2="100" y2="270" stroke="#17324d" stroke-width="7" /><line x1="105" y1="190" x2="142" y2="190" stroke="#17324d" stroke-width="2" /><line x1="142" y1="122" x2="142" y2="246" stroke="#17324d" stroke-width="2" /><line x1="142" y1="122" x2="200" y2="122" stroke="#17324d" stroke-width="2" /><line x1="75" y1="117" x2="97" y2="100" stroke="#617487" stroke-width="1.5" /><line x1="75" y1="135" x2="97" y2="118" stroke="#617487" stroke-width="1.5" /><line x1="75" y1="153" x2="97" y2="136" stroke="#617487" stroke-width="1.5" /><line x1="75" y1="171" x2="97" y2="154" stroke="#617487" stroke-width="1.5" /><line x1="75" y1="189" x2="97" y2="172" stroke="#617487" stroke-width="1.5" /><line x1="75" y1="207" x2="97" y2="190" stroke="#617487" stroke-width="1.5" /><line x1="75" y1="225" x2="97" y2="208" stroke="#617487" stroke-width="1.5" /><line x1="75" y1="243" x2="97" y2="226" stroke="#617487" stroke-width="1.5" /><line x1="75" y1="261" x2="97" y2="244" stroke="#617487" stroke-width="1.5" /><line x1="75" y1="279" x2="97" y2="262" stroke="#617487" stroke-width="1.5" /><path d="M200 122 L216 105 L240 139 L264 105 L288 139 L312 105 L336 139 L352 122 L460 122" fill="none" stroke="#087f8c" stroke-width="3"/><line x1="460" y1="122" x2="460" y2="246" stroke="#17324d" stroke-width="2" /><line x1="142" y1="246" x2="250" y2="246" stroke="#17324d" stroke-width="2" /><line x1="250" y1="228" x2="250" y2="264" stroke="#ce