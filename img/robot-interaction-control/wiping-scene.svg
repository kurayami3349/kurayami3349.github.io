<svg xmlns="http://www.w3.org/2000/svg" width="700" height="550" viewBox="0 0 700 550" role="img"><title>贯穿任务：接近、压住、沿表面移动</title><desc>机器人擦拭垫接触弹性表面；法向x压入表面为正，切向y沿表面，机器人推力F与环境反力相反。</desc><defs><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#087f8c"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#b45038"/></marker></defs><rect width="700" height="550" rx="14" fill="#f6f9fc"/><g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif"><text x="25" y="40" font-size="28" fill="#203b50" font-weight="600">贯穿任务：接近、压住、沿表面移动</text><g transform="translate(55 65) scale(1.1)"><path d="M0 150 V105 L70 30 L150 75 L200 150" fill="none" stroke="#7b91a3" stroke-width="25" stroke-linejoin="round"/><circle cx="70" cy="30" r="14" fill="#fff" stroke="#7b91a3" stroke-width="5"/><circle cx="150" cy="75" r="14" fill="#fff" stroke="#7b91a3" stroke-width="5"/><rect x="176" y="152" width="48" height="25" rx="4" fill="#087f8c"/></g><rect x="190" y="260" width="450" height="72" fill="#dcebed"/><path d="M190 260 L640 260" stroke="#203b50" stroke-width="3" fill="none" /><path d="M275 190 L275 242" stroke="#b45038" stroke-width="3" fill="none" marker-end="url(#red)"/><text x="295" y="205" font-size="21" fill="#b45038" >F：垫子压表面</text><path d="M335 310 L335 264" stroke="#087f8c" stroke-width="3" fill="none" marker-end="url(#teal)"/><text x="355" y="308" font-size="21" fill="#087f8c" >环境反力 −F</text><path d="M475 205 L615 205" stroke="#087f8c" stroke-width="3" fill="none" marker-end="url(#teal)"/><text x="480" y="185" font-size="21" fill="#203b50" >+y：沿表面擦拭</text><path d="M610 270 L610 350" stroke="#087f8c" stroke-width="3" fill="none" marker-end="url(#teal)"/><text x="485" y="378" font-size="21" fill="#203b50" >+x：压入表面</text><path d="M225 304 L305 304" stroke="#3769ac" stroke-width="3" fill="none" stroke-dasharray="6 5"/><text x="38" y="324" font-size="21" fill="#3769ac" >平衡点 x₀</text><text x="430" y="250" font-size="20" fill="#586f7e" >未变形表面 x_w = 0</text><rect x="25" y="407" width="650" height="120" rx="12" fill="#fff" stroke="#087f8c" stroke-width="2"/><text x="43" y="442" font-size="25" fill="#087f8c" font-weight="600">同一场景，只更换法向控制器</text><text x="43" y="477" font-size="22" fill="#586f7e" >Kₑ 决定表面软硬；x 是垫面的真实位置。</text><text x="43" y="508" font-size="22" fill="#586f7e" >导纳再引入虚拟参考 x_v，由内环追踪。</text></g></svg>
