<svg xmlns="http://www.w3.org/2000/svg" width="700" height="630" viewBox="0 0 700 630" role="img"><title>把 3.10 的“失去接触”接回任务流程</title><desc>从接近、建立接触到擦拭，再按完成或接触丢失选择退出或重新接近。</desc><defs><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#087f8c"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#b45038"/></marker></defs><rect width="700" height="630" rx="14" fill="#f6f9fc"/><g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif"><text x="25" y="40" font-size="28" fill="#203b50" font-weight="600">把 3.10 的“失去接触”接回任务流程</text><rect x="45" y="80" width="600" height="84" rx="12" fill="#fff" stroke="#087f8c" stroke-width="2"/><text x="63" y="115" font-size="25" fill="#087f8c" font-weight="600">接近表面</text><text x="63" y="150" font-size="22" fill="#586f7e" >运动目标；有限接近速度</text><path d="M345 168 L345 210" stroke="#087f8c" stroke-width="3" fill="none" marker-end="url(#teal)"/><text x="365" y="198" font-size="20" fill="#586f7e" >接触持续成立</text><rect x="45" y="215" width="600" height="84" rx="12" fill="#fff" stroke="#087f8c" stroke-width="2"/><text x="63" y="250" font-size="25" fill="#087f8c" font-weight="600">建立接触</text><text x="63" y="285" font-size="22" fill="#586f7e" >逐步增加目标力；保持参考连续</text><path d="M345 303 L345 345" stroke="#087f8c" stroke-width="3" fill="none" marker-end="url(#teal)"/><rect x="45" y="350" width="600" height="84" rx="12" fill="#fff" stroke="#087f8c" stroke-width="2"/><text x="63" y="385" font-size="25" fill="#087f8c" font-weight="600">沿表面擦拭</text><text x="63" y="420" font-size="22" fill="#586f7e" >切向运动＋法向交互控制</text><path d="M345 438 L345 480" stroke="#087f8c" stroke-width="3" fill="none" marker-end="url(#teal)"/><text x="365" y="468" font-size="20" fill="#586f7e" >完成 / 失去接触</text><rect x="45" y="485" width="600" height="118" rx="12" fill="#fff" stroke="#087f8c" stroke-width="2"/><text x="63" y="520" font-size="25" fill="#087f8c" font-weight="600">退出，或重新接近</text><text x="63" y="555" font-size="22" fill="#586f7e" >卸载并保持，或带速度约束搜索表面。</text><text x="63" y="586" font-size="22" fill="#586f7e" >任务逻辑负责切换目标，控制器负责执行。</text><path d="M45 544 H20 V122 H40" stroke="#087f8c" stroke-width="2.5" fill="none" marker-end="url(#teal)"/></g></svg>
