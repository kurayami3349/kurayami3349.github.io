<svg xmlns="http://www.w3.org/2000/svg" width="700" height="935" viewBox="0 0 700 935" role="img" aria-labelledby="title desc">
<title id="title">CRAFT：结果支持到哪一步？</title><desc id="desc">三任务消融的均值依次为20.0、46.7、56.7。相邻配置同时改变正则与调度，或改变本体状态表示，需要交叉对照区分机制。</desc>
<defs><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#007c83"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#3769ac"/></marker></defs>
<rect width="700" height="935" rx="14" fill="#f6f9fc"/>
<g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif"><text x="28" y="42" font-size="27" fill="#203b50" font-weight="600">CRAFT：结果支持到哪一步？</text><text x="28" y="83" font-size="23" fill="#52697a" >Table III：三任务，每任务每配置 10 次</text><rect x="30" y="125" width="640" height="115" rx="12" fill="#ffffff" stroke="#007c83" stroke-width="2"/><text x="52" y="168" font-size="26" fill="#203b50" >π₀-base</text><text x="52" y="210" font-size="23" fill="#52697a" >关节位置 q</text><text x="640" y="192" font-size="35" fill="#007c83" text-anchor="end" font-weight="600">20.0%</text><rect x="30" y="325" width="640" height="115" rx="12" fill="#ffffff" stroke="#007c83" stroke-width="2"/><text x="52" y="368" font-size="26" fill="#203b50" >＋VIB</text><text x="52" y="410" font-size="23" fill="#52697a" >仍用关节位置 q</text><text x="640" y="392" font-size="35" fill="#007c83" text-anchor="end" font-weight="600">46.7%</text><rect x="30" y="525" width="640" height="115" rx="12" fill="#ffffff" stroke="#007c83" stroke-width="2"/><text x="52" y="568" font-size="26" fill="#203b50" >＋VIB &amp; Force</text><text x="52" y="610" font-size="23" fill="#52697a" >本体条件改为力矩 τ</text><text x="640" y="592" font-size="35" fill="#007c83" text-anchor="end" font-weight="600">56.7%</text><path d="M350 244 L350 317" fill="none" stroke="#007c83" stroke-width="3"  marker-end="url(#teal)"/><text x="370" y="282" font-size="23" fill="#007c83" >＋26.7 个百分点</text><text x="30" y="280" font-size="22" fill="#52697a" >正则 ＋ 调度</text><path d="M350 444 L350 517" fill="none" stroke="#007c83" stroke-width="3"  marker-end="url(#teal)"/><text x="370" y="482" font-size="23" fill="#007c83" >＋10.0 个百分点</text><text x="30" y="480" font-size="22" fill="#52697a" >q → τ</text><text x="30" y="691" font-size="25" fill="#203b50" >待区分：表征正则、课程顺序、力信息</text><rect x="30" y="717" width="640" height="145" rx="12" fill="#edf2fa" stroke="#3769ac" stroke-width="2"/><text x="50" y="756" font-size="23" fill="#3769ac" >交叉对照：q / τ / q＋τ</text><text x="50" y="795" font-size="23" fill="#3769ac" >× 无 VIB / 固定 KL / 衰减 KL</text><text x="50" y="834" font-size="22" fill="#52697a" >再用力矩时序干预检查模型如何依赖力</text><text x="30" y="903" font-size="23" fill="#203b50" >较大的可见增量发生在引入力矩之前。</text></g></svg>
