<svg xmlns="http://www.w3.org/2000/svg" width="600" height="256" viewBox="0 0 600 256" role="img" aria-labelledby="title desc">
<title id="title">CRAFT 三任务消融成功率</title><desc id="desc">按Table III重绘，三任务各配置各10次。共同横轴从0至100%。π₀-base以关节位置q为条件时成功率20.0%，加入VIB后为46.7%，再换成关节力矩τ后为56.7%。</desc>
