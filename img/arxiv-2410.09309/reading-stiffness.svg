<svg xmlns="http://www.w3.org/2000/svg" width="700" height="780" viewBox="0 0 700 780" role="img" aria-labelledby="title desc">
<title id="title">ACP：把柔顺限制在一个方向</title><desc id="desc">准静态的二维截面示意。两轴受相同增量力，高刚度为4低刚度为1，对应各轴位移为四分之一或一。</desc>
<defs><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#007c83"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#3769ac"/></marker></defs>
<rect width="700" height="780" rx="14" fill="#f6f9fc"/>
<g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif"><text x="28" y="42" font-size="27" fill="#203b50" font-weight="600">ACP：把柔顺限制在一个方向</text><text x="28" y="82" font-size="23" fill="#52697a" >固定目标、固定轴 u；Δx = K⁻¹ Δf</text><text x="28" y="119" font-size="22" fill="#52697a" >相同力增量：两轴均为 1；刚度示例：高 4，低 1</text><rect x="25" y="150" width="650" height="175" rx="12" fill="#ffffff" stroke="#cbd8e2" stroke-width="2"/><text x="45" y="192" font-size="25" fill="#203b50" >各向高刚度</text><text x="45" y="230" font-size="23" fill="#007c83" >k_u = 4，k_v = 4</text><text x="45" y="272" font-size="20" fill="#52697a" >两轴偏移都小</text><path d="M455 310 V195 H580" fill="none" stroke="#9caebb" stroke-width="2"/><text x="587" y="202" font-size="22" fill="#52697a" >v</text><text x="448" y="338" font-size="22" fill="#52697a" >u</text><path d="M480 195 V220 H455" fill="none" stroke="#007c83" stroke-width="1.5" stroke-dasharray="4 4"/><path d="M455 195 L480 220" fill="none" stroke="#007c83" stroke-width="3"  marker-end="url(#teal)"/><text x="490" y="226" font-size="22" fill="#007c83" >Δx</text><rect x="25" y="340" width="650" height="175" rx="12" fill="#ffffff" stroke="#cbd8e2" stroke-width="2"/><text x="45" y="382" font-size="25" fill="#203b50" >各向低刚度</text><text x="45" y="420" font-size="23" fill="#007c83" >k_u = 1，k_v = 1</text><text x="45" y="462" font-size="20" fill="#52697a" >两轴偏移都大</text><path d="M455 500 V385 H580" fill="none" stroke="#9caebb" stroke-width="2"/><text x="587" y="392" font-size="22" fill="#52697a" >v</text><text x="448" y="528" font-size="22" fill="#52697a" >u</text><path d="M555 385 V485 H455" fill="none" stroke="#007c83" stroke-width="1.5" stroke-dasharray="4 4"/><path d="M455 385 L555 485" fill="none" stroke="#007c83" stroke-width="3"  marker-end="url(#teal)"/><text x="565" y="491" font-size="22" fill="#007c83" >Δx</text><rect x="25" y="530" width="650" height="175" rx="12" fill="#ffffff" stroke="#cbd8e2" stroke-width="2"/><text x="45" y="572" font-size="25" fill="#203b50" >沿 u 柔顺</text><text x="45" y="610" font-size="23" fill="#007c83" >k_u = 1，k_v = 4</text><text x="45" y="652" font-size="20" fill="#52697a" >沿 u 让位，沿 v 保持刚度</text><path d="M455 690 V575 H580" fill="none" stroke="#9caebb" stroke-width="2"/><text x="587" y="582" font-size="22" fill="#52697a" >v</text><text x="448" y="718" font-size="22" fill="#52697a" >u</text><path d="M480 575 V675 H455" fill="none" stroke="#007c83" stroke-width="1.5" stroke-dasharray="4 4"/><path d="M455 575 L480 675" fill="none" stroke="#007c83" stroke-width="3"  marker-end="url(#teal)"/><text x="490" y="681" font-size="22" fill="#007c83" >Δx</text><text x="28" y="751" font-size="22" fill="#52697a" >箭头按 1 / k 缩放；u 与 v 是正交方向。</text></g></svg>
