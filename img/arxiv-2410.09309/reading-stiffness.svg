<svg xmlns="http://www.w3.org/2000/svg" width="600" height="256" viewBox="0 0 600 256" role="img" aria-labelledby="title desc">
<title id="title">相同力幅值下的位移轮廓</title><desc id="desc">固定目标和柔顺轴，准静态归一化位移增量为 K 的逆乘外力增量。力增量模长为一，方向扫过平面。高刚度产生半径0.25的小圆，低刚度产生半径1的大圆，沿u柔顺产生u半轴1、v半轴0.25的椭圆。三图坐标尺度相同，括号为u、v方向的刚度。</desc>
<rect width="600" height="256" fill="#fff"/>
<g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, Droid Sans Fallback, sans-serif"><text x="100" y="30" font-size="26" fill="#263746" text-anchor="middle">高刚度</text><ellipse cx="100" cy="132" rx="16.5" ry="16.5" fill="#007f82" fill-opacity=".12" stroke="#007f82" stroke-width="2.5"/><path d="M22 132 L177 132" fill="none" stroke="#c8d0d5" stroke-width="1.5" /><path d="M100 210 L100 55" fill="none" stroke="#c8d0d5" stroke-width="1.5" /><path d="M172 128 L178 132 L172 136 M96 60 L100 54 L104 60" fill="none" stroke="#9aa8b2" stroke-width="1.5"/><path d="M166 128 L166 136" fill="none" stroke="#657580" stroke-width="1.5" /><text x="166" y="161" font-size="26" fill="#657580" text-anchor="middle">1</text><text x="182" y="140" font-size="26" fill="#657580" font-style="italic">u</text><text x="110" y="58" font-size="26" fill="#657580" font-style="italic">v</text><circle cx="100" cy="132" r="2.5" fill="#263746"/><text x="100" y="241" font-size="26" fill="#657580" text-anchor="middle">(4, 4)</text><text x="300" y="30" font-size="26" fill="#263746" text-anchor="middle">低刚度</text><ellipse cx="300" cy="132" rx="66" ry="66" fill="#007f82" fill-opacity=".12" stroke="#007f82" stroke-width="2.5"/><path d="M222 132 L377 132" fill="none" stroke="#c8d0d5" stroke-width="1.5" /><path d="M300 210 L300 55" fill="none" stroke="#c8d0d5" stroke-width="1.5" /><path d="M372 128 L378 132 L372 136 M296 60 L300 54 L304 60" fill="none" stroke="#9aa8b2" stroke-width="1.5"/><path d="M366 128 L366 136" fill="none" stroke="#657580" stroke-width="1.5" /><text x="366" y="161" font-size="26" fill="#657580" text-anchor="middle">1</text><text x="382" y="140" font-size="26" fill="#657580" font-style="italic">u</text><text x="310" y="58" font-size="26" fill="#657580" font-style="italic">v</text><circle cx="300" cy="132" r="2.5" fill="#263746"/><text x="300" y="241" font-size="26" fill="#657580" text-anchor="middle">(1, 1)</text><text x="500" y="30" font-size="26" fill="#263746" text-anchor="middle">沿 u 柔顺</text><ellipse cx="500" cy="132" rx="66" ry="16.5" fill="#007f82" fill-opacity=".12" stroke="#007f82" stroke-width="2.5"/><path d="M422 132 L577 132" fill="none" stroke="#c8d0d5" stroke-width="1.5" /><path d="M500 210 L500 55" fill="none" stroke="#c8d0d5" stroke-width="1.5" /><path d="M572 128 L578 132 L572 136 M496 60 L500 54 L504 60" fill="none" stroke="#9aa8b2" stroke-width="1.5"/><path d="M566 128 L566 136" fill="none" stroke="#657580" stroke-width="1.5" /><text x="566" y="161" font-size="26" fill="#657580" text-anchor="middle">1</text><text x="582" y="140" font-size="26" fill="#657580" font-style="italic">u</text><text x="510" y="58" font-size="26" fill="#657580" font-style="italic">v</text><circle cx="500" cy="132" r="2.5" fill="#263746"/><text x="500" y="241" font-size="26" fill="#657580" text-anchor="middle">(1, 4)</text></g></svg>
