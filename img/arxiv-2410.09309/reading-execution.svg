<svg xmlns="http://www.w3.org/2000/svg" width="700" height="1050" viewBox="0 0 700 1050" role="img" aria-labelledby="title desc">
<title id="title">ACP：从离线标签到在线闭环</title><desc id="desc">训练标签与在线执行分层。参考位置和虚拟位置之差恢复方向，刚度与虚拟目标进入实时力反馈闭环。</desc>
<defs><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#007c83"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#3769ac"/></marker></defs>
<rect width="700" height="1050" rx="14" fill="#f6f9fc"/>
<g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif"><text x="28" y="42" font-size="27" fill="#203b50" font-weight="600">ACP：从离线标签到在线闭环</text><rect x="30" y="75" width="640" height="105" rx="12" fill="#ffffff" stroke="#52697a" stroke-width="2"/><text x="50" y="112" font-size="24" fill="#203b50" >离线：示范 → 平滑力 → 构造动作标签</text><text x="50" y="151" font-size="22" fill="#52697a" >标签监督：参考位姿、虚拟目标、低刚度</text><path d="M350 184 L350 239" fill="none" stroke="#007c83" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#teal)"/><text x="370" y="218" font-size="21" fill="#52697a" >学得策略参数</text><rect x="30" y="245" width="640" height="175" rx="12" fill="#ffffff" stroke="#007c83" stroke-width="2"/><text x="50" y="282" font-size="24" fill="#203b50" >在线：RGB / 位姿 / 力历史 → 扩散策略</text><text x="50" y="320" font-size="22" fill="#52697a" >每臂输出 19 维动作</text><rect x="48" y="343" width="180" height="58" rx="12" fill="#eaf5f5" stroke="#007c83" stroke-width="2"/><text x="138" y="380" font-size="21" fill="#203b50" text-anchor="middle">参考位姿 9D</text><rect x="260" y="343" width="180" height="58" rx="12" fill="#eaf5f5" stroke="#007c83" stroke-width="2"/><text x="350" y="380" font-size="21" fill="#203b50" text-anchor="middle">虚拟目标 9D</text><rect x="472" y="343" width="180" height="58" rx="12" fill="#eaf5f5" stroke="#007c83" stroke-width="2"/><text x="562" y="380" font-size="21" fill="#203b50" text-anchor="middle">低刚度 1D</text><path d="M350 424 L350 477" fill="none" stroke="#007c83" stroke-width="3"  marker-end="url(#teal)"/><rect x="30" y="485" width="640" height="140" rx="12" fill="#ffffff" stroke="#007c83" stroke-width="2"/><text x="50" y="522" font-size="24" fill="#203b50" >位置差 d = p_virtual − p_ref → 方向 u</text><text x="50" y="562" font-size="24" fill="#007c83" >K = k_high I + (k_low − k_high) uuᵀ</text><text x="50" y="598" font-size="22" fill="#52697a" >三维平移刚度；姿态由位姿目标指定</text><path d="M260 629 L260 689" fill="none" stroke="#007c83" stroke-width="3"  marker-end="url(#teal)"/><text x="280" y="663" font-size="22" fill="#007c83" >K ＋ 虚拟目标</text><rect x="30" y="697" width="440" height="107" rx="12" fill="#ffffff" stroke="#007c83" stroke-width="2"/><text x="52" y="735" font-size="24" fill="#203b50" >高频导纳控制器</text><text x="52" y="775" font-size="22" fill="#52697a" >实时力 → 运动响应 / 位姿指令</text><rect x="510" y="697" width="160" height="107" rx="12" fill="#edf2fa" stroke="#3769ac" stroke-width="2"/><text x="590" y="738" font-size="25" fill="#3769ac" text-anchor="middle">F/T</text><text x="590" y="777" font-size="22" fill="#3769ac" text-anchor="middle">实时反馈</text><path d="M506 750 L475 750" fill="none" stroke="#3769ac" stroke-width="3"  marker-end="url(#blue)"/><path d="M260 808 L260 863" fill="none" stroke="#007c83" stroke-width="3"  marker-end="url(#teal)"/><rect x="30" y="870" width="440" height="70" rx="12" fill="#ffffff" stroke="#007c83" stroke-width="2"/><text x="250" y="914" font-size="24" fill="#203b50" text-anchor="middle">机器人 ↔ 接触环境</text><path d="M474 905 H590 V809" fill="none" stroke="#3769ac" stroke-width="3" marker-end="url(#blue)"/><text x="30" y="984" font-size="22" fill="#52697a" >读图重点：参考位置用于恢复方向；</text><text x="30" y="1019" font-size="22" fill="#52697a" >虚拟目标与刚度矩阵共同决定执行响应。</text></g></svg>
