{% assign pdf_url = include.file | relative_url %}
<details class="paper-pdf">
  <summary>阅读原文 PDF</summary>
  <p><a href="{{ pdf_url | escape }}" target="_blank" rel="noopener noreferrer">在新窗口打开 PDF</a>（无法内嵌显示时可使用此链接）</p>
  <iframe
    src="{{ pdf_url | escape }}#view=fitH"
    title="{{ include.title | default: '论文 PDF' | escape }}"
    loading="lazy"
    referrerpolicy="no-referrer"
  ></iframe>
</details>

<style>
  .paper-pdf {
    margin: 1.5rem 0;
    padding: 1rem;
    border: 1px solid var(--main-border-color);
    border-radius: 0.5rem;
    background: var(--card-bg);
  }
  .paper-pdf summary { cursor: pointer; color: var(--link-color); }
  .paper-pdf iframe { width: 100%; height: 70vh; border: 0; }
</style>
